[tool.pytest.ini_options]
# Les modules du projet sont à plat à la racine (pas de paquet) :
# on ajoute la racine au chemin d'import plutôt que de restructurer le projet.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
# On mesure le code du projet, pas les tests eux-mêmes ni l'environnement virtuel.
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true

[tool.black]
line-length = 120
extend-exclude = "tests"
