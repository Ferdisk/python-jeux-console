# Chaîne d'intégration continue du projet.
#
# Le cours R5.A.07 demande que le pipeline s'exécute sur un « runner Docker »,
# c'est-à-dire dans un conteneur isolé plutôt que directement sur la machine
# hôte. GitHub Actions permet cela avec la clé `container:` : le job entier
# tourne alors dans l'image indiquée, ce qui garantit un environnement
# identique à chaque exécution.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer la chaîne à la demande depuis l'onglet Actions,
  # sans avoir à produire un commit.
  workflow_dispatch:

jobs:
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    # L'exigence « runner Docker » du cours : tout le job s'exécute ici.
    container: python:3.11-slim

    steps:
      # L'image slim est volontairement minimale et ne contient pas git ;
      # actions/checkout en a besoin pour récupérer le dépôt proprement.
      - name: Installer git dans le conteneur
        run: apt-get update -qq && apt-get install -y -qq git

      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer les dépendances de développement
        run: pip install --no-cache-dir -q -r requirements-dev.txt

      # Première barrière : le code doit au moins être syntaxiquement valide.
      # Inutile de lancer les tests si un fichier ne compile pas.
      - name: Vérifier que tout le code compile
        run: python -m compileall -q .

      # La couverture indique quelle part du code est effectivement exercée
      # par les tests. Le rapport XML sert ensuite à l'analyse SonarQube.
      - name: Lancer les tests et mesurer la couverture
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Publier la couverture dans le résumé d'exécution
        if: always()
        run: |
          {
            echo "## Couverture de code"
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture
          path: coverage.xml

  qualite:
    name: Analyse statique et style
    runs-on: ubuntu-latest
    container: python:3.11-slim

    steps:
      - name: Installer git dans le conteneur
        run: apt-get update -qq && apt-get install -y -qq git

      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer les outils de qualité
        run: pip install --no-cache-dir -q -r requirements-dev.txt

      # Seule étape bloquante de ce job : les erreurs qui empêchent réellement
      # le programme de fonctionner (variable non définie, comparaison
      # impossible, except mal formé). Le style, lui, ne doit pas arrêter la
      # chaîne : on veut le mesurer, pas s'y heurter.
      - name: Erreurs réelles (bloquant)
        run: ruff check --select E9,F63,F7,F82 --output-format=concise .

      # Le comparatif chiffré des quatre analyseurs, publié dans le résumé
      # d'exécution. C'est la matière du rapport d'expérimentation.
      - name: Comparatif Ruff / Flake8 / Pylint / Black
        if: always()
        run: bash .github/scripts/comparatif-analyseurs.sh

      - name: Détail des remarques Pylint
        if: always()
        run: pylint --output-format=colorized --exit-zero Allu.py devinette.py morpion.py Menu.py Principal.py GestionScore.py Existe.py

  securite:
    name: Sécurité (code et dépendances)
    runs-on: ubuntu-latest
    container: python:3.11-slim

    steps:
      - name: Installer git dans le conteneur
        run: apt-get update -qq && apt-get install -y -qq git

      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer les outils de sécurité
        run: pip install --no-cache-dir -q -r requirements-dev.txt

      # SAST : analyse du code source à la recherche de motifs dangereux.
      # Non bloquant : sur ce projet les remarques portent sur pickle et
      # random, qu'il faut interpréter plutôt que corriger aveuglément.
      - name: Bandit — analyse du code
        if: always()
        run: |
          bandit -r Allu.py devinette.py morpion.py Menu.py Principal.py GestionScore.py Existe.py \
                 -f txt -o bandit.txt --exit-zero
          {
            echo "## Bandit — analyse statique de sécurité"
            echo '```'
            tail -20 bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Analyse des dépendances : compare les versions épinglées à une base
      # de vulnérabilités connues. Cette étape est bloquante — contrairement
      # aux remarques de style, une dépendance vulnérable est un fait objectif
      # qui doit arrêter la chaîne.
      - name: pip-audit — vulnérabilités des dépendances
        # `shell: bash` active pipefail : sans cela, l'échec de pip-audit
        # serait masqué par le succès de `tee` en bout de tube.
        shell: bash
        run: pip-audit -r requirements-dev.txt | tee audit.txt

      - name: Publier le résultat de l'audit
        if: always()
        run: |
          {
            echo "## pip-audit — vulnérabilités des dépendances"
            echo '```'
            cat audit.txt 2>/dev/null || echo "audit interrompu"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  conteneur:
    name: Image Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t jeux-console:${{ github.sha }} .

      # Vérification minimale mais réelle : l'image démarre et tous les
      # modules du projet se chargent. Le jeu lui-même est interactif et
      # ne peut pas être joué dans un pipeline.
      - name: Vérifier que l'image démarre
        run: |
          docker run --rm jeux-console:${{ github.sha }} \
            python -c "import Menu, GestionScore, morpion, devinette, Allu, Existe; print('modules charges')"

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    # L'analyse a besoin du rapport de couverture produit par les tests.
    needs: tests

    steps:
      # Le job reste vert tant que le jeton n'a pas été enregistré dans les
      # secrets du dépôt : l'analyse est simplement sautée.
      - name: Vérifier la présence du jeton
        id: jeton
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN absent : analyse SonarQube ignorée." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Récupérer le code
        if: steps.jeton.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          # Historique complet : Sonar s'en sert pour dater les problèmes
          # et distinguer le code neuf du code hérité.
          fetch-depth: 0

      - name: Récupérer le rapport de couverture
        if: steps.jeton.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rapport-couverture

      - name: Analyser le projet
        if: steps.jeton.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
