# Configuration de l'analyse SonarQube Cloud.
#
# La clé de projet et l'organisation sont celles affichées par SonarCloud
# au moment de la création du projet.

sonar.projectKey=Ferdisk_python-jeux-console
sonar.organization=ferdisk

sonar.projectName=Jeux console en Python
sonar.projectVersion=1.02

# Le code du projet est à la racine ; les tests sont déclarés à part pour
# que Sonar ne compte pas leurs lignes comme de la dette technique.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,.venv/**,.github/**

sonar.python.version=3.11

# Rapport produit par pytest-cov dans le job « tests » et récupéré en artefact.
sonar.python.coverage.reportPaths=coverage.xml
